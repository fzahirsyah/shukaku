<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><title>SHIKAKU engine checks</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px;background:#f7f7f2;color:#25333a}li{padding:8px}.fail{color:#a23d50}button{padding:12px}</style></head><body><h1>Engine, storage and solver checks</h1><p>Runs entirely in this browser. No installation required.</p><button id="run">Run checks</button><p id="summary" role="status"></p><ol id="results"></ol><script type="module">import {runTests} from './engine-tests.js';import {runStorageTests} from './storage-tests.js';import {runSolverTests,runWorkerTests} from './solver-tests.js';import {runVerificationTests} from './verification-tests.js';async function run(){document.querySelector('#run').disabled=true;const results=[...runTests(),...runSolverTests(),...await runStorageTests(),...await runWorkerTests(),...await runVerificationTests()];document.querySelector('#results').replaceChildren(...results.map(result=>{const li=document.createElement('li');li.className=result.pass?'pass':'fail';li.textContent=(result.pass?'PASS ':'FAIL ')+result.name+(result.error?' — '+result.error:'');return li;}));document.querySelector('#summary').textContent=`${results.filter(r=>r.pass).length}/${results.length} passed`;window.testResults=results;document.querySelector('#run').disabled=false;}document.querySelector('#run').onclick=run;run();</script></body></html>
